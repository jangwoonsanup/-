<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장운산업 독립형 근태 시스템</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
        
        /* 로그인 화면 */
        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 80vh; flex-direction: column; background: linear-gradient(135deg, #0f172a 0%, #115e59 100%); position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; }
        .login-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3); width: 100%; max-width: 400px; text-align: center; }
        .system-title { font-size: 28px; font-weight: 900; color: #115e59; margin-bottom: 5px; letter-spacing: -1px; }
        .system-subtitle { font-size: 13px; color: #0d9488; font-weight: bold; margin-bottom: 25px; letter-spacing: 1px; }
        
        /* 메인 화면 */
        #attendance-main-content { display: none; max-width: 1200px; margin: 0 auto; }
        .main-header { background: #115e59; color: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .main-header h1 { margin: 0; font-size: 20px; font-weight: bold; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        
        .grid-layout { display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }
        @media (max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }
        
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; height: fit-content; }
        .card-title { font-size: 16px; font-weight: bold; color: #115e59; margin-bottom: 20px; border-left: 4px solid #0d9488; padding-left: 10px; }
        
        .form-control { display: flex; flex-direction: column; margin-bottom: 16px; }
        .form-control label { font-size: 12px; color: #64748b; margin-bottom: 6px; font-weight: bold; }
        .form-control input, .form-control select { padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; width: 100%; }
        .form-control input:focus, .form-control select:focus { border-color: #0d9488; outline: none; box-shadow: 0 0 0 3px rgba(13,148,136,0.1); }
        
        .btn-submit { background-color: #0d9488; color: white; border: none; padding: 13px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s; }
        .btn-submit:hover { background-color: #0f766e; }
        .btn-danger { background-color: #ef4444; padding: 4px 8px; font-size: 11px; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        .table-wrapper { overflow-x: auto; margin-top: 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; min-width: 500px; }
        th, td { border-bottom: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background-color: #f8fafc; color: #475569; font-weight: bold; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; color: white; display: inline-block; }
        .badge-waiting { background-color: #f59e0b; }
        .badge-approved { background-color: #10b981; }
        .badge-rejected { background-color: #ef4444; }
        .badge-1st { background-color: #3b82f6; }
    </style>
</head>
<body>

    <!-- 🔐 근태 전용 로그인 섹션 -->
    <div id="login-section" class="login-wrapper">
        <div class="login-card">
            <div class="system-title">JW 장운산업</div>
            <div class="system-subtitle">독립형 근태/휴가 등록 시스템</div>
            <form id="loginForm">
                <div class="form-control" style="text-align: left;"><label>사내 아이디 (ID)</label><input type="text" id="userId" placeholder="예: 1001 또는 admin" required></div>
                <div class="form-control" style="text-align: left;"><label>비밀번호 (Password)</label><input type="password" id="userPw" value="1234" required></div>
                <button type="submit" class="btn-submit">인증 및 로그인</button>
            </form>
            <div style="margin-top: 20px; font-size: 11px; color: #94a3b8; text-align: left;">
                * 테스트용 ID 안내: <br>
                - admin (최고관리자)<br>
                - 1001 (사출부 사원)<br>
                - 1002 (조립부 조장)
            </div>
        </div>
    </div>

    <!-- ⚙️ 메인 공간 -->
    <div id="attendance-main-content">
        <div class="main-header">
            <h1 id="welcome-title">장운산업 근태 시스템</h1>
            <button class="btn-logout" id="btnLogout">로그아웃</button>
        </div>

        <div class="grid-layout">
            <!-- 📝 상신 폼 -->
            <div class="card">
                <div class="card-title">근태 및 휴가 등록</div>
                <form id="attForm">
                    <div class="form-control">
                        <label>대상자 성명 (자동 세팅)</label>
                        <select id="attEmpSelect" required></select>
                    </div>
                    <div class="form-control"><label>일자</label><input type="date" id="attDate" required></div>
                    <div class="form-control">
                        <label>근태 구분</label>
                        <select id="attType">
                            <option value="출근" selected>정상 출근</option>
                            <option value="연차">연차(휴가)</option>
                            <option value="반차">반차</option>
                            <option value="지각">지각</option>
                            <option value="조퇴">조퇴</option>
                        </select>
                    </div>
                    <div class="form-control"><label>연장 근로 (H)</label><input type="number" id="attOvertime" value="0" min="0" max="12" step="0.5"></div>
                    <button type="submit" class="btn-submit">근태 제출하기</button>
                </form>
            </div>

            <!-- 📊 이력 장부 -->
            <div class="card">
                <div class="card-title">근태 등록 이력 (수정/삭제 가능)</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr><th>일자</th><th>소속부서</th><th>성명</th><th>구분</th><th>연장(H)</th><th>진행상태</th><th>관리</th></tr>
                        </thead>
                        <tbody id="myAttTableBody">
                            <tr><td colspan="7" style="text-align:center; color:#94a3b8;">데이터가 없습니다.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 💡 1. 100% 독립 데이터 세팅 (파이어베이스 연동 없음)
        // 테스트를 위해 가상의 직원 명부를 미리 넣어둡니다.
        const dummyEmployees = [
            { id: "admin", name: "최고관리자", dept: "관리", role: "admin", pos: "대표" },
            { id: "1001", name: "김근태", dept: "사출", role: "user", pos: "사원" },
            { id: "1002", name: "박조립", dept: "조립", role: "jojang", pos: "조장" }
        ];

        // 브라우저 로컬 스토리지에 독립적인 키값 사용
        const STORAGE_KEY = 'standalone_attendance_data';
        let attendanceData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let loggedInUser = null;

        // 초기 날짜 오늘로 세팅
        const getToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
        document.getElementById("attDate").value = getToday();

        // 🔐 2. 로그인 로직 (e.preventDefault 적용 완료)
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault(); // 튕김 방지
            const uid = document.getElementById("userId").value;
            const upw = document.getElementById("userPw").value;

            // 비밀번호는 모두 1234로 통일하여 테스트
            const user = dummyEmployees.find(emp => emp.id === uid);
            
            if (user && upw === "1234") {
                loggedInUser = user;
                document.getElementById("login-section").style.display = "none";
                document.getElementById("attendance-main-content").style.display = "block";
                document.getElementById("welcome-title").innerText = `장운산업 근태 시스템 [${loggedInUser.dept} - ${loggedInUser.name}]`;
                
                initEmpSelect();
                renderRecords();
            } else {
                alert("존재하지 않는 아이디이거나 비밀번호가 틀렸습니다.");
            }
        });

        // 로그아웃
        document.getElementById("btnLogout").addEventListener("click", function() { location.reload(); });

        // 👥 3. 부서별 대상자 세팅
        function initEmpSelect() {
            const sel = document.getElementById("attEmpSelect");
            sel.innerHTML = "";
            
            // 관리자는 전 직원, 조장은 같은 부서원, 일반 사원은 자기 자신만
            let targetEmps = [];
            if (loggedInUser.role === "admin") {
                targetEmps = dummyEmployees;
            } else if (loggedInUser.role === "jojang") {
                targetEmps = dummyEmployees.filter(e => e.dept === loggedInUser.dept);
            } else {
                targetEmps = [loggedInUser];
            }

            targetEmps.forEach(e => {
                sel.innerHTML += `<option value="${e.name}" data-dept="${e.dept}">[${e.dept}] ${e.name}</option>`;
            });
        }

        // 📝 4. 근태 제출 상신 로직 (e.preventDefault 적용 완료)
        document.getElementById("attForm").addEventListener("submit", function(e) {
            e.preventDefault(); // 튕김 방지
            
            const empSelect = document.getElementById("attEmpSelect");
            if(empSelect.selectedIndex < 0) return;
            const selectedOption = empSelect.options[empSelect.selectedIndex];

            const newRecord = {
                id: Date.now(),
                regById: loggedInUser.id,
                date: document.getElementById("attDate").value,
                name: selectedOption.value,
                dept: selectedOption.getAttribute('data-dept'),
                type: document.getElementById("attType").value,
                overtime: parseFloat(document.getElementById("attOvertime").value) || 0,
                status: "대기" // 독립 버전이므로 대기로 픽스
            };

            // 데이터 배열에 넣고 로컬스토리지 저장
            attendanceData.push(newRecord);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(attendanceData));
            
            alert("근태 등록이 완료되었습니다.");
            document.getElementById("attOvertime").value = "0"; // 시간만 초기화
            renderRecords();
        });

        // 🗑️ 5. 삭제 기능 (잘못 등록했을 때 지울 수 있게)
        window.deleteAtt = function(id) {
            if(confirm("이 근태 기록을 완전히 삭제하시겠습니까?")) {
                attendanceData = attendanceData.filter(a => a.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(attendanceData));
                renderRecords();
            }
        };

        // 📊 6. 장부 렌더링 로직
        function renderRecords() {
            const tbody = document.getElementById("myAttTableBody");
            if(!tbody) return;
            tbody.innerHTML = "";

            // 권한에 따른 데이터 필터링
            // 관리자: 전체 다 보임 / 그 외: 자기가 등록한 것 + 자기 이름으로 등록된 것
            let displayData = attendanceData;
            if (loggedInUser.role !== "admin") {
                displayData = attendanceData.filter(a => a.regById === loggedInUser.id || a.name === loggedInUser.name);
            }
            
            if(displayData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#94a3b8;">등록된 근태 내역이 없습니다.</td></tr>`;
                return;
            }

            // 최신 글이 위로 오도록 역순 출력
            [...displayData].reverse().forEach(r => {
                let bColor = "badge-waiting";
                if(r.status === "1차 승인") bColor = "badge-1st";
                if(r.status === "최종 승인") bColor = "badge-approved";
                if(r.status === "반려") bColor = "badge-rejected";

                tbody.innerHTML += `
                    <tr>
                        <td>${r.date}</td>
                        <td><span style="font-weight:bold; color:#115e59;">${r.dept}</span></td>
                        <td>${r.name}</td>
                        <td><strong>${r.type}</strong></td>
                        <td class="text-right">${r.overtime > 0 ? r.overtime : "-"}</td>
                        <td><span class="badge ${bColor}">${r.status}</span></td>
                        <td><button class="btn-danger" onclick="deleteAtt(${r.id})">삭제</button></td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
